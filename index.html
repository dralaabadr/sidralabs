<style>
:root{
--primary:#0d47a1;
--secondary:#1976d2;
--light:#f4f8ff;
--dark:#081b33;
--white:#fff;
--shadow:0 12px 35px rgba(0,0,0,.12);
--radius:18px;
--gradient:linear-gradient(135deg,#0d47a1,#42a5f5);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--light);color:#222;line-height:1.8}
section{padding:90px 6%}
a{text-decoration:none}

/* ================= HEADER ================= */
header{
position:sticky;top:0;z-index:999;
background:#fff;
box-shadow:0 5px 20px rgba(0,0,0,.08);
padding:12px 6%;
display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap
}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;color:var(--primary)}
.logo img{height:52px}
nav ul{display:flex;gap:22px;list-style:none;flex-wrap:wrap}
nav a{color:#222;font-weight:700}
nav a:hover{color:var(--primary)}
.social a{margin:0 5px;color:#fff;padding:8px 12px;border-radius:8px;font-weight:700}
.fb{background:#1877f2}.yt{background:#ff0000}.wa{background:#25d366}
.lang-switch button{
border:none;border-radius:8px;padding:6px 10px;
font-weight:800;cursor:pointer;background:#eee;margin:0 2px
}
.lang-switch .active{background:var(--primary);color:#fff}
